<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Chrono Elite v3.0</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="tabs-container">
                <button id="tab-stopwatch" class="tab-btn active">Cronómetro</button>
                <button id="tab-countdown" class="tab-btn">Cuenta Atrás</button>
            </div>
            <button id="theme-toggle" class="theme-btn" title="Cambiar Tema">☀️</button>
        </header>

        <main class="glass-card">
            <div id="display" class="main-display">00:00:00<span class="ms">.000</span></div>
            
            <div id="countdown-setup" class="setup-panel hidden">
                <p class="setup-label">Añadir tiempo rápido:</p>
                <div class="quick-adds">
                    <button class="add-time" data-sec="1">+1s</button>
                    <button class="add-time" data-sec="5">+5s</button>
                    <button class="add-time" data-sec="10">+10s</button>
                    <button class="add-time" data-sec="30">+30s</button>
                    <button class="add-time" data-sec="60">+1m</button>
                </div>
                <div class="manual-inputs">
                    <input type="number" id="h-input" placeholder="00" min="0">
                    <span>:</span>
                    <input type="number" id="m-input" placeholder="00" min="0" max="59">
                    <span>:</span>
                    <input type="number" id="s-input" placeholder="00" min="0" max="59">
                </div>
            </div>

            <div class="main-controls">
                <button id="btn-start" class="btn-main start">Iniciar</button>
                <button id="btn-lap" class="btn-main lap">Serie (L)</button>
                <button id="btn-reset" class="btn-main reset">Reiniciar (R)</button>
            </div>
        </main>

        <section class="analytics-grid">
            <div class="card chart-card">
                <div class="card-header">Trend de Rendimiento</div>
                <canvas id="performanceChart"></canvas>
            </div>
            <div class="card table-card">
                <div class="card-header">
                    <span>Historial</span>
                    <button id="btn-export" class="export-btn">CSV ↓</button>
                </div>
                <div class="table-scroll">
                    <table id="laps-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Tiempo</th>
                                <th>Δ Delta</th>
                            </tr>
                        </thead>
                        <tbody id="laps-body"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
